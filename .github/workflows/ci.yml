name: Checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '20.18.1' }
          - { os: ubuntu-latest, node: '22' }
          - { os: ubuntu-latest, node: '24' }
          - { os: windows-latest, node: '24' }
          - { os: macos-latest, node: '24' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run check:release
      - run: npm pack --dry-run
      - name: Install Chromium and Linux dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium
        if: runner.os != 'Linux'
        run: npx playwright install chromium
      - name: Verify browser runtime
        run: node --input-type=module -e "import { chromium } from 'playwright'; const browser = await chromium.launch(); try { const page = await browser.newPage(); await page.setContent('<h1>Ready</h1>'); if (await page.locator('h1').textContent() !== 'Ready') throw new Error('Browser failed'); } finally { await browser.close(); }"
